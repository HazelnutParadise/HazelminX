# Build, test and smoke-run Core (Go) and the agent workspace (Rust) on
# native x86_64 and ARM64 Linux. Tool versions come from core/go.mod and
# agent/rust-toolchain.toml; actions are pinned to commit SHAs.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    name: core (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Go version matches go.mod
        run: |
          want="go$(awk '/^go /{print $2}' go.mod)"
          have="$(go env GOVERSION)"
          echo "go.mod: $want, toolchain: $have"
          test "$want" = "$have"
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build (no embedded UI until ticket 005)
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -o "$RUNNER_TEMP/dist/hazelminx-core" ./cmd/hazelminx-core
      - name: Smoke test the binary on this OS
        run: |
          bin="$RUNNER_TEMP/dist/hazelminx-core"
          data="$RUNNER_TEMP/core-data"
          "$bin" -listen 127.0.0.1:19800 -agent-listen 127.0.0.1:19801 \
            -data-dir "$data" -log-format text >"$RUNNER_TEMP/core.log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true; cat "$RUNNER_TEMP/core.log"' EXIT
          for _ in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:19800/healthz >/dev/null 2>&1; then break; fi
            sleep 0.1
          done
          curl -fsS http://127.0.0.1:19800/healthz
          echo
          # Without -tags embedweb the UI path must say so instead of serving a blank page.
          code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:19800/)"
          echo "GET / -> $code"
          test "$code" = "503"
      - name: Dependency report
        run: |
          bin="$RUNNER_TEMP/dist/hazelminx-core"
          report="$RUNNER_TEMP/dist/dependencies-core-${{ matrix.arch }}.txt"
          { file "$bin"; ldd "$bin" 2>&1 || true; } | tee "$report"
          # CGO_ENABLED=0: the host needs no C library or compiler.
          grep -q "statically linked" "$report"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hazelminx-core-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error

  agent:
    name: agent (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: agent
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain (agent/rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc --version
          grep -q "$(rustc --version | awk '{print $2}')" rust-toolchain.toml
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            agent/target
          key: cargo-${{ matrix.arch }}-${{ hashFiles('agent/rust-toolchain.toml', 'agent/Cargo.lock') }}
          restore-keys: cargo-${{ matrix.arch }}-
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Real-host tests (systemd, root; the runner VM is disposable)
        # Separate target dir so root-owned build files stay out of the cache.
        run: |
          sudo --preserve-env=RUSTUP_HOME,CARGO_HOME,CARGO_TARGET_DIR \
            HAZELMINX_DISPOSABLE_HOST=1 "$(command -v cargo)" test -p hazelminx-privileged \
            --locked --test linux_host -- --ignored --test-threads=1
        env:
          RUSTUP_HOME: /home/runner/.rustup
          CARGO_HOME: /home/runner/.cargo
          CARGO_TARGET_DIR: ${{ runner.temp }}/target-root
      - run: cargo build --workspace --release --locked
      - name: Smoke test the binaries on this OS
        run: |
          rel=target/release
          "$rel/hazelminx-agent" --version
          "$rel/hazelminx-privileged" --version
          state="$RUNNER_TEMP/agent-state"
          "$rel/hazelminx-agent" --config /nonexistent.toml --state-dir "$state" identity
          test "$(stat -c %a "$state/identity")" = "700"
          "$rel/hazelminx-privileged" --config /nonexistent.toml --allowed-uid 0 check-config
      - name: Collect binaries and dependency report
        run: |
          dist="$RUNNER_TEMP/dist"
          mkdir -p "$dist"
          report="$dist/dependencies-agent-${{ matrix.arch }}.txt"
          for b in hazelminx-agent hazelminx-privileged; do
            cp "target/release/$b" "$dist/"
            { echo "== $b"; file "$dist/$b"; ldd "$dist/$b"; } | tee -a "$report"
          done
          # Only the C runtime; TLS is rustls/ring, so no libssl or libcrypto.
          unexpected="$(grep '=>' "$report" | awk '{print $1}' \
            | grep -vE '^(libc|libm|libgcc_s|libpthread|libdl|librt|ld-linux[^ ]*)\.so' || true)"
          if [ -n "$unexpected" ]; then echo "unexpected shared libraries: $unexpected"; exit 1; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hazelminx-agent-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error

  # Core against the real agent and privileged executor binaries: the
  # Core<->Agent interop tests (test-only actions build) and the host change
  # ledger copy end to end (root, systemd; the runner VM is disposable).
  interop:
    name: interop (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Install the pinned Rust toolchain (agent/rust-toolchain.toml)
        working-directory: agent
        run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            agent/target
          key: cargo-interop-${{ matrix.arch }}-${{ hashFiles('agent/rust-toolchain.toml', 'agent/Cargo.lock') }}
          restore-keys: cargo-interop-${{ matrix.arch }}-
      - name: Build the agent (with test actions) and the executor
        working-directory: agent
        run: cargo build --locked -p hazelminx-agent -p hazelminx-privileged --features hazelminx-agent/test-actions
      - name: Core<->Agent interop
        working-directory: core
        run: go test ./internal/nodes -run Interop -count=1 -v
        env:
          HAZELMINX_AGENT_BIN: ${{ github.workspace }}/agent/target/debug/hazelminx-agent
      - name: Host facts and metrics, end to end
        working-directory: core
        run: go test ./internal/hostmetrics -run Interop -count=1 -v
        env:
          HAZELMINX_AGENT_BIN: ${{ github.workspace }}/agent/target/debug/hazelminx-agent
      - name: Container engine detection, end to end (root)
        working-directory: core
        run: |
          sudo --preserve-env=HAZELMINX_AGENT_BIN,HAZELMINX_PRIVILEGED_BIN,GOCACHE,GOMODCACHE,GOFLAGS \
            HAZELMINX_DISPOSABLE_HOST=1 "$(command -v go)" test ./internal/engines -run Interop -count=1 -v
        env:
          HAZELMINX_AGENT_BIN: ${{ github.workspace }}/agent/target/debug/hazelminx-agent
          HAZELMINX_PRIVILEGED_BIN: ${{ github.workspace }}/agent/target/debug/hazelminx-privileged
          GOCACHE: ${{ runner.temp }}/go-build-root
          GOMODCACHE: /home/runner/go/pkg/mod
          GOFLAGS: -mod=readonly
      - name: Host change ledger copy, end to end (root)
        working-directory: core
        run: |
          sudo --preserve-env=HAZELMINX_AGENT_BIN,HAZELMINX_PRIVILEGED_BIN,GOCACHE,GOMODCACHE,GOFLAGS \
            HAZELMINX_DISPOSABLE_HOST=1 "$(command -v go)" test ./internal/hostledger -run Interop -count=1 -v
        env:
          HAZELMINX_AGENT_BIN: ${{ github.workspace }}/agent/target/debug/hazelminx-agent
          HAZELMINX_PRIVILEGED_BIN: ${{ github.workspace }}/agent/target/debug/hazelminx-privileged
          GOCACHE: ${{ runner.temp }}/go-build-root
          GOMODCACHE: /home/runner/go/pkg/mod
          GOFLAGS: -mod=readonly
      - name: Storage usage, end to end (agent as nobody, executor as root)
        working-directory: core
        run: |
          sudo --preserve-env=HAZELMINX_AGENT_BIN,HAZELMINX_PRIVILEGED_BIN,GOCACHE,GOMODCACHE,GOFLAGS \
            HAZELMINX_DISPOSABLE_HOST=1 "$(command -v go)" test ./internal/hoststorage -run Interop -count=1 -timeout 30m -v
        env:
          HAZELMINX_AGENT_BIN: ${{ github.workspace }}/agent/target/debug/hazelminx-agent
          HAZELMINX_PRIVILEGED_BIN: ${{ github.workspace }}/agent/target/debug/hazelminx-privileged
          GOCACHE: ${{ runner.temp }}/go-build-root
          GOMODCACHE: /home/runner/go/pkg/mod
          GOFLAGS: -mod=readonly
